[tool.poetry]
name = "multi_agent_project"
version = "0.1.0"
description = "A project for deploying multiple agents using Vertex AI."
authors = ["Your Name <youremail@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
fastapi = "0.115.13"
google-cloud-aiplatform = { version = "1.97.0", extras = ["adk", "agent_engines"] }
google-adk = { version = "1.3.0", extras = ["extensions", "vertexai"] }
a2a-sdk = "0.2.8"
wikipedia = "1.4.0"
dateparser = "1.2.1"
langchain-community = "0.3.25"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
