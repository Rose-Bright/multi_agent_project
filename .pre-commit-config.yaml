ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

repos:
  # 🔹 Pre-commit standard hooks (Git hygiene, YAML, whitespace, etc.)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      #- id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  # 🔹 Formatting (ruff includes black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.7
    hooks:
      - id: ruff
        args: ["--fix", "--config=pyproject.toml"]

  # 🔹 Upgrade old Python syntax
  - repo: https://github.com/asottile/pyupgrade
    rev: v2.31.0
    hooks:
      - id: pyupgrade
        args: [--py37-plus]

  # 🔹 Security checks (detect vulnerabilities, bad practices)
  #  - repo: https://github.com/PyCQA/bandit
  #    rev: 1.7.8
  #    hooks:
  #      - id: bandit
  #        args: ["-r", "agents", "main.py"]

  # 🔹 Security checks (detect vulnerabilities, bad practices)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-r", "agents", "main.py"]

  # 🔹 Check manifest for packaging issues
  - repo: https://github.com/mgedmin/check-manifest
    rev: "0.47"
    hooks:
      - id: check-manifest
        stages: [manual]

  # 🔹 Typo detection
  - repo: https://github.com/codespell-project/codespell
    rev: v2.1.0
    hooks:
      - id: codespell
        exclude: static/frontend/package-lock.json

  # 🔹 Regex-based Python code checks (prevent bad practices)
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.9.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-log-warn
      - id: python-no-eval
      - id: python-use-type-annotations
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
